<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phoenix pose sheet</title>
<style>
  html,body{margin:0;background:#0d0b0a;overflow:hidden}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="sheet" width="1500" height="960"></canvas>
<script src="js/util.js"></script>
<script src="js/particles.js"></script>
<script src="js/flight.js"></script>
<script src="js/phoenix.js"></script>
<script>
(function (NS) {
  const c = document.getElementById('sheet');
  const ctx = c.getContext('2d');

  function fabricateTrail(b, dirX, dirY, spacing, n) {
    b.trail.length = 0;
    for (let i = 0; i < 46; i++) {
      b.trail.push({
        x: b.x - 11.6 * b.scale - dirX * i * spacing,
        y: b.y - dirY * i * spacing + Math.sin(i * 0.28) * 3
      });
    }
  }

  function pose(opts) {
    const b = new NS.Phoenix({ scale: opts.scale || 3.0 });
    b.x = opts.x; b.y = opts.y;
    b.t = opts.t != null ? opts.t : 1.2;
    b.heading = opts.heading || 0;
    b.facing = opts.facing || 1;
    b.facingBlend = b.facing;
    b.vx = (opts.facing || 1) * (opts.speed != null ? opts.speed : 240);
    b.vy = 0;
    b.wingPhase = opts.phase != null ? opts.phase : 0;
    b.flap = NS.flapCurve(b.wingPhase);
    b.fold = NS.foldCurve(b.wingPhase);
    b.spread = opts.spread != null ? opts.spread : 1;
    b.bank = opts.bank || 0;
    b.bob = -b.flap * 2.2 * b.scale;
    b.heat = opts.heat || 0;
    b.crestSway = opts.crest != null ? opts.crest : 0.8;
    b.legsOut = opts.legs || 0;
    b.carrying = !!opts.carrying;
    b.tailSpread = opts.tailSpread || 1;
    b.wingRangeMul = opts.range || 1;
    b.blink = opts.blink || 0;
    b.gliding = !!opts.gliding;
    b.maxSpeed = 340;
    if (opts.burn != null) { b.burning = true; b.burnT = 1.0; b.burnFront = opts.burn; }
    fabricateTrail(b, (opts.facing || 1), 0, opts.trailSpacing != null ? opts.trailSpacing : 5.5);
    return b;
  }

  function label(x, y, s) {
    ctx.save();
    ctx.fillStyle = 'rgba(220,190,150,0.6)';
    ctx.font = '12px ui-monospace, monospace';
    ctx.fillText(s, x, y);
    ctx.restore();
  }

  ctx.fillStyle = '#0d0b0a';
  ctx.fillRect(0, 0, c.width, c.height);

  // grid guides
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  for (let i = 1; i < 5; i++) { ctx.beginPath(); ctx.moveTo(i*300,0); ctx.lineTo(i*300,c.height); ctx.stroke(); }
  for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(0,i*240); ctx.lineTo(c.width,i*240); ctx.stroke(); }

  // ---- row 1: one wingbeat cycle -----------------------------------
  const phases = [0.00, 0.14, 0.28, 0.42, 0.62, 0.82];
  for (let i = 0; i < 5; i++) {
    const b = pose({ x: 150 + i * 300, y: 120, phase: phases[i], scale: 3.0 });
    b.draw(ctx);
    label(20 + i * 300, 226, 'beat p=' + phases[i].toFixed(2));
  }

  // ---- row 2: flight modes -----------------------------------------
  const r2 = [
    { t: 'glide',    o: { phase: 0.0, gliding: true, spread: 0.88, flapOverride: 0.18 } },
    { t: 'hover',    o: { phase: 0.2, speed: 40, trailSpacing: 1.4, legs: 1, crest: 0.15 } },
    { t: 'bank',     o: { phase: 0.3, bank: 0.8, heading: 0.35 } },
    { t: 'left',     o: { phase: 0.18, facing: -1, heading: -0.25 } },
    { t: 'carrying', o: { phase: 0.24, legs: 1, carrying: true, speed: 90, trailSpacing: 2.6 } }
  ];
  r2.forEach((cell, i) => {
    const b = pose(Object.assign({ x: 150 + i * 300, y: 360, scale: 3.0 }, cell.o));
    if (cell.o.flapOverride != null) { b.flap = cell.o.flapOverride; b.fold = 0.06; b.bob = 0.9; b.gliding = true; }
    b.draw(ctx);
    label(20 + i * 300, 466, cell.t);
  });

  // ---- row 3: the burn ---------------------------------------------
  const r3 = [
    { t: 'heat .35',       o: { heat: 0.35, range: 1.2, tailSpread: 1.3, speed: 30, trailSpacing: 1.6, legs: .7 } },
    { t: 'heat .7 wide',   o: { heat: 0.7, range: 1.45, tailSpread: 1.7, speed: 20, trailSpacing: 1.3, legs: .7 } },
    { t: 'front -8',       o: { heat: 0.8, range: 1.5, burn: -8, tailSpread: 2, speed: 20, trailSpacing: 1.2 } },
    { t: 'front +4',       o: { heat: 0.9, range: 1.5, burn: 4, tailSpread: 2, speed: 20, trailSpacing: 1.2 } },
    { t: 'front +16',      o: { heat: 1.0, range: 1.55, burn: 16, tailSpread: 2.1, speed: 20, trailSpacing: 1.2 } }
  ];
  r3.forEach((cell, i) => {
    const b = pose(Object.assign({ x: 150 + i * 300, y: 620, scale: 3.0 }, cell.o));
    b.draw(ctx);
    label(20 + i * 300, 726, cell.t);
  });

  // ---- row 4: scale reference (real sizes) --------------------------
  [1.0, 1.3, 1.6, 2.0].forEach((s, i) => {
    const b = pose({ x: 180 + i * 320, y: 850, phase: 0.2, scale: s, trailSpacing: 4.5 });
    b.draw(ctx);
    label(60 + i * 320, 930, 'scale ' + s);
  });

  window.SHEET_READY = true;
})(window.PX);
</script>
</body>
</html>
